# ─────────────────────────────────────────────────────────────────────────
# tfl — Türkisch als Fremdsprache. Instantiated from the canonical boulingua
# template `pagegen` (Hugo + hugo-coder).
#
# Course-local values below: baseURL, title, languageCode,
# defaultContentLanguage, [params].navTitle/description/keywords/code, the
# [[params.social]] repo URL, [params.plausible].domain and the [[menu.main]]
# entries. Everything else is the shared standard and is kept byte-identical
# to pagegen so the course can be re-aligned when the template moves.
#
# Metalanguage is German (ROADMAP §1): explanations, navigation and legal
# pages are German; the language being taught — and every item tagged in the
# curriculum block — is Turkish.
# ─────────────────────────────────────────────────────────────────────────

baseURL = "https://boulingua.github.io/tfl/"
title = "Türkçe — S. Le Boulanger"
languageCode = "tr"
defaultContentLanguage = "de"
enableEmoji = false
enableRobotsTXT = true

[pagination]
  pagerSize = 20

[markup.highlight]
  noClasses = false

[markup.goldmark.renderer]
  unsafe = true

[markup.tableOfContents]
  startLevel = 2
  endLevel = 3
  ordered = false

# Tags are DECLARED, not implicit — derive them from structured fields.
[taxonomies]
  tag = "tags"
  skill = "skills"
  level = "levels"
  topic = "topics"

[params]
  navTitle = "Türkçe"
  author = "S. Le Boulanger"
  description = "Türkisch als Fremdsprache, Stufe 0 bis B1: Alphabet und Vokalharmonie, curriculumsgebundene Einheiten, Modellprüfungen, Materialien und Audio."
  keywords = "turkish,türkçe,CEFR,curriculum,OER,vowel-harmony"
  dateFormat = "2006-01-02"
  since = 2025
  colorScheme = "auto"
  hideCredits = true
  # The colour-scheme toggle is a labelled control in the navbar
  # (layouts/_partials/header.html); disable the theme's floating duplicate
  # so there is exactly one toggle on the page.
  hideColorSchemeToggle = true
  customCSS = ["css/custom.css"]
  # Site code — selects this course's accent from data/accents.yaml
  # (tfl → #C7236A light / #E77EAC dark). Never edit the CSS to change it.
  code = "tfl"
  # Content licence, surfaced by pdf attribution + legal pages.
  license = "CC BY-SA 4.0"

  # IMPORTANT — every sub-table under [params] MUST come AFTER all bare
  # [params] keys. TOML scopes everything after a header to that header, so
  # opening [params.plausible] before the keys above would silently move them
  # under params.plausible and leave the site unstyled. Keep this block LAST.
  [params.plausible]
    # Privacy-friendly, cookieless analytics. Set domain to enable; leave
    # empty to disable (the head partial is guarded on domain).
    domain = "boulingua.github.io/tfl"
    src = "https://plausible.io/js/script.js"

[[params.social]]
  name = "GitHub"
  icon = "fa-brands fa-github fa-2x"
  weight = 1
  url = "https://github.com/boulingua/tfl"

